services:
  pflogsumm-gui:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Opcional: montar el directorio del proyecto para desarrollo
      - .:/opt/PFLogSumm-HTML-GUI
      # Opcional: montar el log si quieres cambiarlo dinámicamente
      - ./mail.log:/var/log/mail.log
    environment:
      # Opcional: configurar idioma
      - LANGUAGE=en
      # Forzar regeneración de reportes al iniciar
      - REGENERATE_REPORTS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
